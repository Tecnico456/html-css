<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible CENTRALIZADO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: lightsalmon;
        }

        main{
            background-color: lightgreen;
            height: 90vh;
            width: 90vw;

            display: flex; /* Ativa o Flexbox */
            flex-flow: row nowrap; /* Define a direção dos itens como linha e não permite que eles quebrem para a próxima linha, é uma forma abreviada de definir flex-direction e flex-wrap */
            justify-content: center; /* Alinha os itens no centro do container */
            align-items: center; /* Alinha os itens no centro do container */
        }

        section{
            background-color: lightseagreen;
            height: 200px;
            width: 200px;
        }
    </style>
</head>
<body>
    <main>
        <section>
            <!-- A tag <section> é usada para agrupar conteúdo relacionado em uma página da web. Ela é frequentemente utilizada para dividir o conteúdo em seções distintas, cada uma com um tema ou propósito específico. -->
            <h1>Tela de Login</h1>

        </section>
    </main>
    
</body>
</html>
